<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel de Mesas</title>

    <link rel="stylesheet" href="css/garcom-mesas.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/sidebar.css">
</head>

<body>

    <!-- Topbar -->
    <header class="topbar">

        <div class="logo">
            <a href="dashboard.html">
                <img src="imgs/img_logo.png" alt="Logo HawkCyber">
            </a>
        </div>

        <div>
            <a href="mesas.html" class="btn-primary" style="text-decoration: none;">
                < Voltar
            </a>
        </div>

        <div class="topbar-right">

            <span class="connection">
                <span class="connection-dot"></span>
                Conectado
            </span>

            <a href="notificacoes.html" class="notificacao">
                🔔
            </a>

            <div class="user-info">
                <strong>Usuário</strong>
                <small>ADM</small>
            </div>

        </div>

    </header>

    <!-- Menu lateral -->
    <aside class="sidebar">

        <nav>

            <a href="dashboard.html" class="menu-item">
                <span>📊</span>
                Dashboard
            </a>

            <a href="funcionarios.html" class="menu-item">
                <span>👥</span>
                Funcionários
            </a>

            <a href="categorias.html" class="menu-item">
                <span>📁</span>
                Categorias
            </a>

            <a href="produtos.html" class="menu-item">
                <span>🍔</span>
                Produtos
            </a>

            <a href="mesas.html" class="menu-item active">
                <span>🪑</span>
                Mesas
            </a>

            <a href="estoque.html" class="menu-item">
                <span>📦</span>
                Estoque
            </a>

            <a href="caixa.html" class="menu-item">
                <span>💰</span>
                Caixa
            </a>

            <a href="relatorios.html" class="menu-item">
                <span>📈</span>
                Relatórios
            </a>

            <a href="configuracoes.html" class="menu-item">
                <span>⚙️</span>
                Configurações
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="perfil.html" class="menu-item">
                <span>👤</span>
                Meu perfil
            </a>

            <a href="login.html" class="menu-item logout">
                <span>🚪</span>
                Sair
            </a>

        </div>

    </aside>

    <!-- Conteúdo principal -->
    <main class="main-content">

        <div class="page-header">

            <div>
                <h1>Painel de Mesas</h1>
                <p>Acompanhe as mesas e os pedidos do salão.</p>
            </div>

            <button class="btn-primary" id="btnNotificacoes">
                🔔 Notificações
            </button>

        </div>

        <section class="filtros">

            <div class="campo-busca">
                <span>🔍</span>

                <input
                    type="text"
                    id="buscaMesa"
                    placeholder="Buscar mesa..."
                >
            </div>

            <div class="filtros-status">

                <button class="filtro active" data-filtro="TODAS">
                    TODAS
                </button>

                <button class="filtro" data-filtro="LIVRE">
                    LIVRES
                </button>

                <button class="filtro" data-filtro="OCUPADA">
                    OCUPADAS
                </button>

                <button class="filtro" data-filtro="RESERVADA">
                    RESERVADAS
                </button>

                <button class="filtro" data-filtro="NOTIFICACAO">
                    🔔 COM NOTIFICAÇÃO
                </button>

            </div>

        </section>

        <section class="mesas-container" id="mesasContainer"></section>

        <div class="estado-vazio" id="estadoVazio">

            <div>🪑</div>

            <h2>Nenhuma mesa encontrada</h2>

            <p>
                Não existem mesas para os filtros selecionados.
            </p>

        </div>

    </main>

    <script src="js/garcom-mesas.js"></script>

</body>

</html>
