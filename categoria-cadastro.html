<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categoria</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/categoria-cadastro.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/sidebar.css">
</head>

<body>

    <!-- Topbar -->
    <header class="topbar">

        <div class="logo">
            <a href="dashboard.html">
                <img src="imgs/img_logo.png" alt="Logo HawkCyber">
            </a>
        </div>

        <div class="topbar-right">

            <div class="connection">
                <span class="connection-dot"></span>
                <span>Conectado</span>
            </div>

            <button class="notification-btn" title="Notificações">
                🔔
            </button>

            <div class="user-info">
                <strong>Usuário</strong>
                <span>ADM</span>
            </div>

        </div>

    </header>

    <!-- Menu lateral -->
    <aside class="sidebar">

        <nav>

            <a href="dashboard.html" class="menu-item">
                <span>📊</span>
                Dashboard
            </a>

            <a href="funcionarios.html" class="menu-item">
                <span>👥</span>
                Funcionários
            </a>

            <a href="categorias.html" class="menu-item active">
                <span>📁</span>
                Categorias
            </a>

            <a href="produtos.html" class="menu-item">
                <span>🍔</span>
                Produtos
            </a>

            <a href="mesas.html" class="menu-item">
                <span>🪑</span>
                Mesas
            </a>

            <a href="estoque.html" class="menu-item">
                <span>📦</span>
                Estoque
            </a>

            <a href="caixa.html" class="menu-item">
                <span>💰</span>
                Caixa
            </a>

            <a href="relatorios.html" class="menu-item">
                <span>📈</span>
                Relatórios
            </a>

            <a href="configuracoes.html" class="menu-item">
                <span>⚙️</span>
                Configurações
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="perfil.html" class="menu-item">
                <span>👤</span>
                Meu perfil
            </a>

            <a href="login.html" class="menu-item logout">
                <span>🚪</span>
                Sair
            </a>

        </div>

    </aside>

    <!-- Conteúdo -->
    <main class="main-content">

        <div class="page-header">

            <div>
                <h1 id="tituloPagina">Nova categoria</h1>
                <p>Cadastre uma nova categoria para organizar os produtos.</p>
            </div>

            <a href="categorias.html" class="btn-voltar">
                ← Voltar
            </a>

        </div>

        <section class="form-card">

            <form id="formCategoria">

                <div class="form-group">
                    <label for="nome">Nome da categoria *</label>

                    <input type="text" id="nome" name="nome" placeholder="Digite o nome da categoria" maxlength="100"
                        required>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>

                    <textarea id="descricao" name="descricao" placeholder="Digite uma descrição para a categoria"
                        maxlength="255" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="ordem">Ordem de exibição *</label>

                    <input type="number" id="ordem" name="ordem" placeholder="Ex: 1" min="1" required>

                    <small>
                        Define a posição da categoria no cardápio.
                    </small>
                </div>

                <div class="form-group">

                    <label for="status">Status *</label>

                    <select id="status" name="status" required>
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                    </select>

                </div>

                <div id="mensagem" class="mensagem"></div>

                <div class="form-actions">

                    <a href="categorias.html" class="btn-cancelar">
                        Cancelar
                    </a>

                    <button type="submit" class="btn-salvar" id="btnSalvar">
                        Salvar categoria
                    </button>

                </div>

            </form>

        </section>

    </main>

    <script src="js/categoria-cadastro.js"></script>

</body>

</html>
