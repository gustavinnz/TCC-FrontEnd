<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mesas</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mesas.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/sidebar.css">
</head>

<body>

    <!-- Topbar -->
    <header class="topbar">

        <div class="logo">
            <a href="dashboard.html">
                <img src="imgs/img_logo.png" alt="Logo HawkCyber">
            </a>
        </div>

        <div class="topbar-right">

            <div class="connection">
                <span class="connection-dot"></span>
                <span>Conectado</span>
            </div>

            <button class="notification-btn" title="Notificações">
                🔔
            </button>

            <div class="user-info">
                <strong>Usuário</strong>
                <span>ADM</span>
            </div>

        </div>

    </header>

    <!-- Menu lateral -->
    <aside class="sidebar">

        <nav>

            <a href="dashboard.html" class="menu-item">
                <span>📊</span>
                Dashboard
            </a>

            <a href="funcionarios.html" class="menu-item">
                <span>👥</span>
                Funcionários
            </a>

            <a href="categorias.html" class="menu-item">
                <span>📁</span>
                Categorias
            </a>

            <a href="produtos.html" class="menu-item">
                <span>🍔</span>
                Produtos
            </a>

            <a href="mesas.html" class="menu-item active">
                <span>🪑</span>
                Mesas
            </a>

            <a href="estoque.html" class="menu-item">
                <span>📦</span>
                Estoque
            </a>

            <a href="caixa.html" class="menu-item">
                <span>💰</span>
                Caixa
            </a>

            <a href="relatorios.html" class="menu-item">
                <span>📈</span>
                Relatórios
            </a>

            <a href="configuracoes.html" class="menu-item">
                <span>⚙️</span>
                Configurações
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="perfil.html" class="menu-item">
                <span>👤</span>
                Meu perfil
            </a>

            <a href="login.html" class="menu-item logout">
                <span>🚪</span>
                Sair
            </a>

        </div>

    </aside>

    <!-- Conteúdo -->
    <main class="main-content">

        <div class="page-header">

            <div>
                <h1>Mesas</h1>
                <p>Gerencie as mesas do estabelecimento.</p>
            </div>

            <a href="mesa-cadastro.html" class="btn-primary">
                + Nova Mesa
            </a>

        </div>

        <!-- Filtros -->
        <section class="filters">

            <div class="filter-group">

                <label for="busca">Buscar mesa</label>

                <input type="text" id="busca" placeholder="Número da mesa...">

            </div>

            <div class="filter-group">

                <label for="status">Status</label>

                <select id="status">

                    <option value="">Todos</option>
                    <option value="LIVRE">Livre</option>
                    <option value="OCUPADA">Ocupada</option>
                    <option value="RESERVADA">Reservada</option>
                    <option value="INDISPONÍVEL">Indisponível</option>

                </select>

            </div>

            <button type="button" id="btnLimpar" class="btn-secondary">
                Limpar
            </button>

        </section>

        <!-- Contador -->
        <div class="table-info">
            <span id="contador">0 mesas encontradas.</span>
        </div>

        <!-- Cards das mesas -->
        <section id="gridMesas" class="mesas-grid"></section>

    </main>

    <script src="js/mesas.js"></script>

</body>

</html>
